; JM-FrontierDeputy v0.1.3
; Red Dead Redemption 2 Story Mode only.
; Press F11 in game to reload this file and Locations.json when no dispatch activity is active.

[Keys]
Interact = E
ToggleDuty = F10
RequestCallout = F7
AcceptCallout = Y
DeclineCallout = N
AbortCallout = End
ReloadConfig = F11
ShowStatus = F6

[Dispatch]
; Delay between automatic callout offers while available.
MinimumSeconds = 45
MaximumSeconds = 120
OfferTimeoutSeconds = 25
ManualRequestBypassesCooldown = true

[Gameplay]
; Distance values are in game units/metres.
StationInteractDistance = 3.5
SceneActivationDistance = 140.0
ConfrontationDistance = 28.0
ArrestDistance = 2.5
JailTurnInDistance = 12.0
CalloutAbandonDistance = 450.0

RequireContextForBooking = true
AllowDuringStoryMissions = false
ShowStationBlips = true
ShowDutyHud = true
EnablePay = true
; RDR2 stores cash as cents. 250 = $2.50.
CompletionPayCents = 250
EnableDebugLogging = false

[Callouts]
SaloonDisturbance = true
RoadsideRobbery = true
WantedOutlaw = true

[Weights]
; Relative selection weights. Set a weight to 0 to prevent selection.
SaloonDisturbance = 40
RoadsideRobbery = 35
WantedOutlaw = 25
